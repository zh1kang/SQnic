name: rust
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m compileall -q scripts
      - run: python -m unittest discover -s tests -p '*_test.py' -v
      - run: python -m pip install --disable-pip-version-check --no-cache-dir ruff==0.12.10
      - run: python -m ruff check scripts/package_release.py scripts/handoff_acceptance.py scripts/benchmark_automatic.py scripts/harness_test.py tests/package_release_test.py tests/handoff_acceptance_test.py tests/release_accuracy_test.py
      - run: node scripts/pi_adapter_test.mjs
        if: runner.os != 'Windows'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo build --release --locked
      - name: release accuracy gate
        shell: bash
        run: |
          binary="target/release/sqnic"
          if [[ "$RUNNER_OS" == "Windows" ]]; then binary+=".exe"; fi
          SQNIC_TEST_BINARY="$binary" python -m unittest discover -s tests -p release_accuracy_test.py -v
      - name: latency gate (10k records, 32 tasks, 2000 files)
        if: runner.os == 'Linux'
        run: python scripts/benchmark_automatic.py --events 10000 --tasks 32 --worktree-files 2000 --samples 50 --gate --output .artifacts/gate-10k.json
      - name: latency gate (100k growing records)
        if: runner.os == 'Linux'
        run: python scripts/benchmark_automatic.py --events 100000 --samples 50 --gate --output .artifacts/gate-100k.json
      - name: latency gate (cold fixture cache, 100k records)
        if: runner.os == 'Linux'
        run: python scripts/benchmark_automatic.py --events 100000 --samples 50 --cold-cache --gate --operations startup_hook restore restore_query read_many search request_history --output .artifacts/gate-cold-100k.json
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux'
        with:
          name: latency-gates
          path: .artifacts/gate-*.json
      - name: smoke test release archive
        shell: bash
        run: |
          target="$(rustc -vV | sed -n 's/^host: //p')"
          version="$(cargo metadata --no-deps --format-version 1 | python -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          binary="target/release/sqnic"
          if [[ "$target" == *windows* ]]; then binary+=".exe"; fi
          python scripts/package_release.py --binary "$binary" --version "$version" --target "$target" --output-dir .artifacts/ci-dist --smoke-test
