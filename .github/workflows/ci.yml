name: rust
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m compileall -q scripts
      - run: python -m unittest discover -s tests -p 'package_release_test.py' -v
      - run: python -m pip install --disable-pip-version-check --no-cache-dir ruff==0.12.10
      - run: python -m ruff check scripts/package_release.py tests/package_release_test.py
      - run: node scripts/pi_adapter_test.mjs
        if: runner.os != 'Windows'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo build --release --locked
